# Xcode-Projekt für die Demo-App: `cd Demo && xcodegen generate` (brew install xcodegen),
# dann KartoDemo.xcodeproj öffnen. Das Package KartoKit wird lokal aus `..` eingebunden.
name: KartoDemo
options:
  bundleIdPrefix: io.github.tobymarks
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  KartoKit:
    path: ..
targets:
  KartoDemo:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - project.yml
          - "*.xcodeproj"
          - "*.md"
          - "*.sh"
          - referenzfahrt.gpx
      # GPX ist für Xcode "text.xml" und würde sonst nicht ins Bundle kopiert.
      - path: referenzfahrt.gpx
        buildPhase: resources
    dependencies:
      - package: KartoKit
        product: KartoRender
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: KartoDemo
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CADisableMinimumFrameDurationOnPhone: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocationWhenInUseUsageDescription: "Zeigt die eigene Position auf der Karte."
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: false
